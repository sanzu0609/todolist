<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="_layout :: layout(~{::section}, 'Profile')">
<section class="form-card" th:fragment="section">
    <h1>Your profile</h1>
    <div class="grid">
        <div class="card">
            <h2>Display name</h2>
            <form th:action="@{/profile}" th:object="${profileForm}" method="post">
                <div class="form-field" th:classappend="${#fields.hasErrors('displayName')} ? 'has-error'">
                    <label for="displayName">Display name</label>
                    <input id="displayName" type="text" th:field="*{displayName}" autocomplete="name">
                    <p class="error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}"></p>
                </div>
                <button type="submit" class="btn btn-primary">Save</button>
            </form>
        </div>
        <div class="card">
            <h2>Change password</h2>
            <form th:action="@{/profile/password}" th:object="${passwordChangeForm}" method="post">
                <div class="form-field" th:classappend="${#fields.hasErrors('oldPassword')} ? 'has-error'">
                    <label for="oldPassword">Current password</label>
                    <input id="oldPassword" type="password" th:field="*{oldPassword}" autocomplete="current-password" required>
                    <p class="error" th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}"></p>
                </div>
                <div class="form-field" th:classappend="${#fields.hasErrors('newPassword')} ? 'has-error'">
                    <label for="newPassword">New password</label>
                    <input id="newPassword" type="password" th:field="*{newPassword}" autocomplete="new-password" required>
                    <p class="error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>
                </div>
                <div class="form-field" th:classappend="${#fields.hasErrors('confirmNewPassword')} ? 'has-error'">
                    <label for="confirmNewPassword">Confirm new password</label>
                    <input id="confirmNewPassword" type="password" th:field="*{confirmNewPassword}" autocomplete="new-password" required>
                    <p class="error" th:if="${#fields.hasErrors('confirmNewPassword')}" th:errors="*{confirmNewPassword}"></p>
                </div>
                <button type="submit" class="btn">Update password</button>
            </form>
        </div>
    </div>
</section>
</html>
