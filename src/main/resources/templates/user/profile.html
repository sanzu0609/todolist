<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="_layout :: layout(~{::section}, 'Profile')">
<section class="py-2" th:fragment="section">
    <h1 class="h2 mb-4">Your profile</h1>
    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="h4 mb-3">Display name</h2>
                    <form th:action="@{/profile}" th:object="${profileForm}" method="post" class="vstack gap-3">
                        <div>
                            <label for="displayName" class="form-label">Display name</label>
                            <input id="displayName" type="text" th:field="*{displayName}" autocomplete="name"
                                   class="form-control" th:classappend="${#fields.hasErrors('displayName')} ? ' is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary px-4">Save</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="h4 mb-3">Change password</h2>
                    <form th:action="@{/profile/password}" th:object="${passwordChangeForm}" method="post" class="vstack gap-3">
                        <div>
                            <label for="oldPassword" class="form-label">Current password</label>
                            <input id="oldPassword" type="password" th:field="*{oldPassword}" autocomplete="current-password" required
                                   class="form-control" th:classappend="${#fields.hasErrors('oldPassword')} ? ' is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}"></div>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="newPassword" class="form-label">New password</label>
                                <input id="newPassword" type="password" th:field="*{newPassword}" autocomplete="new-password" required
                                       class="form-control" th:classappend="${#fields.hasErrors('newPassword')} ? ' is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="confirmNewPassword" class="form-label">Confirm new password</label>
                                <input id="confirmNewPassword" type="password" th:field="*{confirmNewPassword}" autocomplete="new-password" required
                                       class="form-control" th:classappend="${#fields.hasErrors('confirmNewPassword')} ? ' is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmNewPassword')}" th:errors="*{confirmNewPassword}"></div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-outline-primary px-4">Update password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</html>
