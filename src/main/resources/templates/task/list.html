<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="_layout :: layout(~{::section}, 'Tasks')">
<section th:fragment="section" class="page-container">
    <div class="page-header">
        <h1>Tasks</h1>
        <a class="btn btn-primary" th:href="@{/tasks/new}">Create Task</a>
    </div>

    <form class="filter-form" th:action="@{/tasks}" method="get">
        <div class="form-row">
            <label for="status">Status</label>
            <select id="status" name="status">
                <option value="">All</option>
                <option th:each="statusOpt : ${statuses}"
                        th:value="${statusOpt}"
                        th:selected="${filter.status()} == ${statusOpt}"
                        th:text="${statusOpt}"></option>
            </select>
        </div>
        <div class="form-row">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
                <option value="">All</option>
                <option th:each="priorityOpt : ${priorities}"
                        th:value="${priorityOpt}"
                        th:selected="${filter.priority()} == ${priorityOpt}"
                        th:text="${priorityOpt}"></option>
            </select>
        </div>
        <div class="form-row">
            <label for="dueOnOrBefore">Due before</label>
            <input id="dueOnOrBefore" name="dueOnOrBefore" type="date"
                   th:value="${filter.dueOnOrBefore()}">
        </div>
        <div class="form-row">
            <label for="q">Search</label>
            <input id="q" name="q" type="text" placeholder="Search title"
                   th:value="${filter.q()}">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn">Apply</button>
            <a class="btn btn-secondary" th:href="@{/tasks}">Reset</a>
        </div>
    </form>

    <div th:if="${page.content.isEmpty()}" class="empty-state">
        <p>No tasks found. Try adjusting your filters or create a new task.</p>
    </div>

    <table class="table" th:if="${!page.content.isEmpty()}">
        <thead>
        <tr>
            <th>Title</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Due Date</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="task : ${page.content}">
            <td th:text="${task.title}"></td>
            <td><span class="badge" th:text="${task.priority}"></span></td>
            <td>
                <form th:action="@{|/tasks/${task.id}/status|}" method="post" class="inline-form" sec:authorize="isAuthenticated()">
                    <select name="status">
                        <option th:each="statusOpt : ${statuses}"
                                th:value="${statusOpt}"
                                th:selected="${task.status} == ${statusOpt}"
                                th:text="${statusOpt}"></option>
                    </select>
                    <input type="hidden" name="version" th:value="${task.version}">
                    <button type="submit" class="btn btn-link">Update</button>
                </form>
            </td>
            <td th:text="${task.dueDate}"></td>
            <td class="actions">
                <a class="btn btn-link" th:href="@{|/tasks/${task.id}|}">View</a>
                <a class="btn btn-link" th:href="@{|/tasks/${task.id}/edit|}">Edit</a>
                <form th:action="@{|/tasks/${task.id}/delete|}" method="post" class="inline-form" sec:authorize="isAuthenticated()"
                      onsubmit="return confirm('Delete this task and all subtasks?');">
                    <button type="submit" class="btn btn-link destructive">Delete</button>
                </form>

            </td>
        </tr>
        </tbody>
    </table>
</section>
</html>
