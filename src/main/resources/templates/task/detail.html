<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="_layout :: layout(~{::section}, ${task.title})">
<section th:fragment="section" class="py-2">
    <div class="d-flex flex-column flex-lg-row align-items-lg-start justify-content-lg-between gap-3 mb-4">
        <div>
            <h1 class="h2 mb-1" th:text="${task.title}">Task title</h1>
            <p class="text-secondary mb-0">Managed by you</p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/tasks}">Back to list</a>
            <a class="btn btn-primary" th:href="@{|/tasks/${task.id}/edit|}">Edit</a>
        </div>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4">
            <div class="row row-cols-1 row-cols-md-3 g-3">
                <div>
                    <p class="text-secondary text-uppercase small fw-semibold mb-1">Priority</p>
                    <span class="badge rounded-pill text-bg-secondary text-uppercase" th:text="${task.priority}"></span>
                </div>
                <div>
                    <p class="text-secondary text-uppercase small fw-semibold mb-1">Status</p>
                    <span class="badge rounded-pill text-bg-info text-uppercase" th:text="${task.status}"></span>
                </div>
                <div>
                    <p class="text-secondary text-uppercase small fw-semibold mb-1">Due date</p>
                    <span th:text="${task.dueDate}">-</span>
                </div>
            </div>
        </div>
        <div class="card-footer bg-white border-top-0 px-4 pb-4">
            <form th:action="@{|/tasks/${task.id}/status|}" method="post"
                  class="row gy-2 gx-3 align-items-center" sec:authorize="isAuthenticated()">
                <div class="col-auto">
                    <label for="statusSelect" class="form-label mb-0">Change status</label>
                </div>
                <div class="col-sm-6 col-md-4">
                    <select id="statusSelect" name="status" class="form-select form-select-sm">
                        <option th:each="statusOpt : ${statuses}"
                                th:value="${statusOpt}"
                                th:selected="${task.status} == ${statusOpt}"
                                th:text="${statusOpt}"></option>
                    </select>
                </div>
                <div class="col-sm-auto">
                    <input type="hidden" name="version" th:value="${task.version}">
                    <input type="hidden" name="redirect" value="detail">
                    <button type="submit" class="btn btn-sm btn-outline-primary px-3">Update</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0 mb-4" th:if="${task.description}">
        <div class="card-body p-4">
            <h2 class="h4 mb-3">Description</h2>
            <p class="mb-0" th:text="${task.description}"></p>
        </div>
    </div>

    <section class="mb-4">
        <div class="d-flex flex-column flex-md-row justify-content-md-between align-items-md-center gap-3 mb-3">
            <h2 class="h4 mb-0">Subtasks</h2>
        </div>
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div th:replace="subtask/_list :: list(${task.id}, ${subtasks}, ${subtaskStatuses})"></div>
                <div class="pt-3 mt-3 border-top" th:replace="subtask/_form :: form(${task.id}, ${newSubtask})"></div>
            </div>
        </div>
    </section>
</section>
</html>
