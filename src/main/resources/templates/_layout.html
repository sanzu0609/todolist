<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout (content, pageTitle='Todolist')">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Todolist</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header>
    <nav class="navbar">
        <a th:href="@{/}" class="brand">todolist</a>
        <ul class="nav-links">
            <li><a th:href="@{/login}">Login</a></li>
            <li><a th:href="@{/tasks}">Tasks</a></li>
            <li><a th:href="@{/profile}" class="disabled" aria-disabled="true">Profile</a></li>
            <li>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" disabled>Logout</button>
                </form>
            </li>
        </ul>
    </nav>
</header>
<main>
    <div th:replace="fragments/_flash :: flash"></div>
    <div th:replace="${content}"></div>
</main>
<footer>
    <small>&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> Todolist</small>
</footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
