<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="_layout :: layout(~{::section}, 'Login')">
<section class="form-card" th:fragment="section">
    <h1>Sign in</h1>
    <div class="flash flash-error" th:if="${param.error}">
        Invalid username or password. Please try again.
    </div>
    <div class="flash flash-success" th:if="${param.logout}">
        You have been logged out.
    </div>
    <div class="flash flash-success" th:if="${param.registered}">
        Registration successful. Please sign in.
    </div>
    <form th:action="@{/login}" method="post">
        <div class="form-field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" required autofocus>
        </div>
        <div class="form-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p class="form-note">Need an account? <a th:href="@{/register}">Register here</a>.</p>
</section>
</html>
