<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="_layout :: layout(~{::content}, 'Home')">
<body>
<section class="py-5" th:fragment="content">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="bg-white rounded-4 shadow-sm p-5 text-center">
                    <h1 class="display-5 fw-semibold mb-3">Welcome to Todolist</h1>
                    <p class="lead text-secondary mb-0">Manage your tasks and subtasks effortlessly with ownership and security built-in.</p>
                    <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center mt-5">
                        <a class="btn btn-outline-primary btn-lg px-4" th:href="@{/login}">Login</a>
                        <a class="btn btn-primary btn-lg px-4" th:href="@{/tasks}">Go to Tasks</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
