<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="_layout :: layout(~{::section}, 'Tasks')">
<section th:fragment="section" class="py-2">
    <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-md-between gap-3 mb-4">
        <h1 class="h2 mb-0">Tasks</h1>
        <a class="btn btn-primary px-4" th:href="@{/tasks/new}">Create Task</a>
    </div>

    <form class="row g-3 g-md-4 align-items-end mb-4" th:action="@{/tasks}" method="get">
        <div class="col-sm-6 col-lg-3">
            <label for="status" class="form-label">Status</label>
            <select id="status" name="status" class="form-select">
                <option value="">All</option>
                <option th:each="statusOpt : ${statuses}"
                        th:value="${statusOpt}"
                        th:selected="${filter.status()} == ${statusOpt}"
                        th:text="${statusOpt}"></option>
            </select>
        </div>
        <div class="col-sm-6 col-lg-3">
            <label for="priority" class="form-label">Priority</label>
            <select id="priority" name="priority" class="form-select">
                <option value="">All</option>
                <option th:each="priorityOpt : ${priorities}"
                        th:value="${priorityOpt}"
                        th:selected="${filter.priority()} == ${priorityOpt}"
                        th:text="${priorityOpt}"></option>
            </select>
        </div>
        <div class="col-sm-6 col-lg-3">
            <label for="dueOnOrBefore" class="form-label">Due before</label>
            <input id="dueOnOrBefore" name="dueOnOrBefore" type="date" class="form-control"
                   th:value="${filter.dueOnOrBefore()}">
        </div>
        <div class="col-sm-6 col-lg-3">
            <label for="q" class="form-label">Search</label>
            <input id="q" name="q" type="text" class="form-control" placeholder="Search title"
                   th:value="${filter.q()}">
        </div>
        <div class="col-12 d-flex flex-wrap gap-2">
            <button type="submit" class="btn btn-primary px-4">Apply</button>
            <a class="btn btn-outline-secondary px-4" th:href="@{/tasks}">Reset</a>
        </div>
    </form>

    <div th:if="${page.content.isEmpty()}" class="alert alert-info border-0 shadow-sm">
        No tasks found. Try adjusting your filters or create a new task.
    </div>

    <div class="table-responsive shadow-sm rounded-3" th:if="${!page.content.isEmpty()}">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
        <tr>
            <th><a th:href="@{/tasks(status=${filter.status()}, priority=${filter.priority()}, dueOnOrBefore=${filter.dueOnOrBefore()}, q=${filter.q()}, sort=${sortCreated})}">Title</a></th>
            <th><a th:href="@{/tasks(status=${filter.status()}, priority=${filter.priority()}, dueOnOrBefore=${filter.dueOnOrBefore()}, q=${filter.q()}, sort=${sortPriority})}">Priority</a></th>
            <th>Status</th>
            <th><a th:href="@{/tasks(status=${filter.status()}, priority=${filter.priority()}, dueOnOrBefore=${filter.dueOnOrBefore()}, q=${filter.q()}, sort=${sortDueDate})}">Due Date</a></th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="task : ${page.content}">
            <td th:text="${task.title}"></td>
            <td><span class="badge rounded-pill text-bg-secondary text-uppercase" th:text="${task.priority}"></span></td>
            <td>
                <form th:action="@{|/tasks/${task.id}/status|}" method="post"
                      class="d-flex flex-wrap align-items-center gap-2" sec:authorize="isAuthenticated()">
                    <select name="status" class="form-select form-select-sm">
                        <option th:each="statusOpt : ${statuses}"
                                th:value="${statusOpt}"
                                th:selected="${task.status} == ${statusOpt}"
                                th:text="${statusOpt}"></option>
                    </select>
                    <input type="hidden" name="version" th:value="${task.version}">
                    <button type="submit" class="btn btn-sm btn-outline-primary">Update</button>
                </form>
            </td>
            <td th:text="${task.dueDate}"></td>
            <td class="d-flex flex-wrap gap-2">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{|/tasks/${task.id}|}">View</a>
                <a class="btn btn-sm btn-outline-secondary" th:href="@{|/tasks/${task.id}/edit|}">Edit</a>
            
            </td>
        </tr>
        </tbody>
        </table>
    </div>
    <div th:replace="fragments/_pagination :: pagination(${page}, ${filter}, ${pageable}, ${currentSort})"></div>
</section>
</html>
