<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="_layout :: layout(~{::section}, ${task.title})">
<section th:fragment="section" class="page-container">
    <div class="page-header">
        <div>
            <h1 th:text="${task.title}">Task title</h1>
            <p class="subtitle">Managed by you</p>
        </div>
        <div class="page-actions">
            <a class="btn" th:href="@{/tasks}">Back to list</a>
            <a class="btn btn-secondary" th:href="@{|/tasks/${task.id}/edit|}">Edit</a>
    
        </div>
    </div>

    <div class="task-summary">
        <dl>
            <div>
                <dt>Priority</dt>
                <dd><span class="badge" th:text="${task.priority}"></span></dd>
            </div>
            <div>
                <dt>Status</dt>
                <dd><span class="badge" th:text="${task.status}"></span></dd>
            </div>
            <div>
                <dt>Due date</dt>
                <dd th:text="${task.dueDate}">-</dd>
            </div>
        </dl>
        <div class="status-update">
            <form th:action="@{|/tasks/${task.id}/status|}" method="post" class="inline-form" sec:authorize="isAuthenticated()">
                <label for="statusSelect">Change status</label>
                <select id="statusSelect" name="status">
                    <option th:each="statusOpt : ${statuses}"
                            th:value="${statusOpt}"
                            th:selected="${task.status} == ${statusOpt}"
                            th:text="${statusOpt}"></option>
                </select>
                <input type="hidden" name="version" th:value="${task.version}">
                <input type="hidden" name="redirect" value="detail">
                <button type="submit" class="btn btn-link">Update</button>
            </form>
        </div>
    </div>

    <div class="task-description" th:if="${task.description}">
        <h2>Description</h2>
        <p th:text="${task.description}"></p>
    </div>

    <section class="subtask-panel">
        <h2>Subtasks</h2>
        <div th:replace="subtask/_list :: list(${task.id}, ${subtasks}, ${subtaskStatuses})"></div>
        <div th:replace="subtask/_form :: form(${task.id}, ${newSubtask})"></div>
    </section>
</section>
</html>
