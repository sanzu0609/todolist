<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="_layout :: layout(~{::section}, ${formTitle})">
<section th:fragment="section" class="py-2">
    <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-lg-between gap-3 mb-4">
        <h1 class="h2 mb-0" th:text="${formTitle}">Task</h1>
        <a class="btn btn-outline-secondary" th:href="@{/tasks}">Back to list</a>
    </div>

    <form th:action="@{${formAction}}" th:object="${form}" method="post"
          class="card shadow-sm border-0">
        <div class="card-body p-4 p-lg-5">
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input id="title" type="text" th:field="*{title}" placeholder="Task title" required
                       class="form-control" th:classappend="${#fields.hasErrors('title')} ? ' is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea id="description" rows="4" th:field="*{description}" placeholder="Optional details"
                          class="form-control" th:classappend="${#fields.hasErrors('description')} ? ' is-invalid'"></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <div class="row g-4">
                <div class="col-md-4">
                    <label for="priority" class="form-label">Priority</label>
                    <select id="priority" th:field="*{priority}" required class="form-select"
                            th:classappend="${#fields.hasErrors('priority')} ? ' is-invalid'">
                        <option th:each="priorityOpt : ${priorities}"
                                th:value="${priorityOpt}"
                                th:text="${priorityOpt}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></div>
                </div>

                <div class="col-md-4">
                    <label for="dueDate" class="form-label">Due date</label>
                    <input id="dueDate" type="date" th:field="*{dueDate}" class="form-control"
                           th:classappend="${#fields.hasErrors('dueDate')} ? ' is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></div>
                </div>

                <div class="col-md-4" th:if="${isEdit}">
                    <label for="status" class="form-label">Status</label>
                    <select id="status" th:field="*{status}" class="form-select"
                            th:classappend="${#fields.hasErrors('status')} ? ' is-invalid'">
                        <option th:each="statusOpt : ${statuses}"
                                th:value="${statusOpt}"
                                th:text="${statusOpt}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                </div>
            </div>

            <input type="hidden" th:if="${isEdit}" th:field="*{version}">
        </div>

        <div class="card-footer bg-white border-top-0 px-4 px-lg-5 py-3">
            <div class="d-flex flex-wrap gap-2">
                <button type="submit" class="btn btn-primary px-4"
                        th:text="${isEdit} ? 'Update' : 'Create'"></button>
                <a class="btn btn-outline-secondary px-4" th:href="@{/tasks}">Cancel</a>
            </div>
        </div>
    </form>
</section>
</html>
