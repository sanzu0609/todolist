<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="_layout :: layout(~{::section}, 'Validation Error')">
<section th:fragment="section" class="page-container">
    <h1>Validation error</h1>

    <a class="btn" th:href="@{/tasks}">Back to tasks</a>
</section>
</html>
