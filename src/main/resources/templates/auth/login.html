<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="_layout :: layout(~{::section}, 'Login')">
<section class="py-2" th:fragment="section">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-xl-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-lg-5">
                    <h1 class="h2 mb-4 text-center">Sign in</h1>
                    <div class="alert alert-danger" th:if="${param.error}">
                        Invalid username or password. Please try again.
                    </div>
                    <div class="alert alert-success" th:if="${param.logout}">
                        You have been logged out.
                    </div>
                    <div class="alert alert-success" th:if="${param.registered}">
                        Registration successful. Please sign in.
                    </div>
                    <form th:action="@{/login}" method="post" class="vstack gap-3">
                        <div>
                            <label for="username" class="form-label">Username</label>
                            <input id="username" name="username" type="text" required autofocus class="form-control">
                        </div>
                        <div>
                            <label for="password" class="form-label">Password</label>
                            <input id="password" name="password" type="password" required class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary px-4">Login</button>
                    </form>
                </div>
                <div class="card-footer text-center bg-white border-top-0 py-3">
                    <p class="mb-0">Need an account?
                        <a th:href="@{/register}">Register here</a>.
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
</html>
